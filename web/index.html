<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>scad-view</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='15'>&#129513;</text></svg>" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header class="pane-head">
          <span class="title">Models</span>
          <span id="root-name" class="muted"></span>
          <span class="spacer"></span>
          <button id="nav-close" type="button" class="icon-btn" aria-label="Close model list">&#10005;</button>
        </header>
        <nav id="tree" class="tree"></nav>
      </aside>
      <div id="scrim" class="scrim"></div>
      <main id="main">
        <header id="toolbar">
          <button id="nav-toggle" type="button" class="icon-btn" aria-label="Show model list" aria-expanded="false">&#9776;</button>
          <span id="model-name" class="model-name"><span class="dir"></span><span class="base">No model selected</span></span>
          <span id="quality-badge" class="badge" hidden></span>
          <span id="stats" class="muted"></span>
          <span class="spacer"></span>
          <span id="watch-dot" class="watch-dot" title="watching for changes"></span>
          <button id="fit-view" type="button" class="icon-btn" aria-label="Fit view" title="Fit view" disabled>&#9974;</button>
          <button id="download-stl" type="button" class="icon-btn" aria-label="Download STL" title="Full render, then download as STL" disabled>&#11015;</button>
          <button id="full-render" type="button" disabled>Full<span class="wide-only"> render</span></button>
        </header>
        <div id="viewport">
          <canvas id="canvas"></canvas>
          <div id="overlay" class="overlay" hidden></div>
        </div>
        <section id="logpane">
          <header class="pane-head">
            <span class="title">Log</span>
            <span id="log-status" class="muted"></span>
            <span class="spacer"></span>
            <button id="log-toggle" type="button" class="linkish">hide</button>
          </header>
          <pre id="log"></pre>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
